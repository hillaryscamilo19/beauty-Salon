<form [formGroup]="appointmentForm" (ngSubmit)="submitAppointment()">
  <label>Client ID:</label>
  <input formControlName="client" type="text" />

  <label>Employee ID:</label>
  <input formControlName="employee" type="text" />

  <label>Service ID:</label>
  <input formControlName="service" type="text" />

  <label>Date:</label>
  <input formControlName="date" type="date" />

  <label>Time:</label>
  <select formControlName="time">
    <option>9:00 AM</option>
    <option>10:00 AM</option>
    <option>11:00 AM</option>
    <option>1:00 PM</option>
    <option>2:00 PM</option>
    <option>3:00 PM</option>
    <option>4:00 PM</option>
  </select>

  <label>Notes:</label>
  <textarea formControlName="notes"></textarea>

  <button type="submit">Book Appointment</button>
</form>
