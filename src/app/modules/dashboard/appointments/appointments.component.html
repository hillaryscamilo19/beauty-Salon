<div class="appointments-container">
  <!-- Status bar - Solo móvil -->
  <div class="status-bar">
    <div class="status-icons">
    </div>
  </div>

  <!-- Header -->
  <header class="appointments-header">
    <button class="back-button">
    </button>
    <h2>Appointment</h2>
  </header>

  <!-- Month selector -->
  <div class="month-selector">
    <button class="month-nav-button" (click)="previousMonth()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="month-name">{{currentMonth}}</span>
    <button class="month-nav-button" (click)="nextMonth()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Calendar -->
  <div class="calendar">
    <div class="weekdays">
      <div *ngFor="let day of days" class="weekday">{{day.dayName}}</div>
    </div>
    <div class="dates">
      <button
        *ngFor="let day of days"
        class="date-button"
        [class.selected]="selectedDate.getDate() === day.date"
        (click)="selectDate(day.date)">
        {{day.date}}
      </button>
    </div>
  </div>

  <!-- Time slots -->
  <div class="time-slots">
    <!-- Morning slots -->
    <div class="slot-section">
      <div class="section-header">
        <div class="dot"></div>
        <h3>Morning</h3>
      </div>
      <div class="slots">
        <button
          *ngFor="let slot of morningSlots"
          class="time-slot"
          [class.selected]="selectedTimeSlot === slot"
          (click)="selectTimeSlot(slot)">
          {{slot}}
        </button>
      </div>
    </div>

    <!-- Afternoon slots -->
    <div class="slot-section">
      <div class="section-header">
        <div class="dot"></div>
        <h3>Afternoon</h3>
      </div>
      <div class="slots">
        <button
          *ngFor="let slot of afternoonSlots"
          class="time-slot"
          [class.selected]="selectedTimeSlot === slot"
          (click)="selectTimeSlot(slot)">
          {{slot}}
        </button>
      </div>
    </div>
  </div>

  <!-- Stylist selection -->
  <div class="stylist-selection">
    <h3>Choose Hair Stylish</h3>
    <div class="stylist-list">
      <button
        *ngFor="let stylist of stylists"
        class="stylist-button"
        [class.selected]="selectedStylist?.id === stylist.id"
        (click)="selectStylist(stylist)">
        <img [src]="stylist.imageUrl" [alt]="stylist.name">
      </button>
    </div>
  </div>

  <!-- Service info -->
  <div class="service-info">
    <div class="service-row">
      <span class="service-name">{{selectedService}}</span>
      <span class="service-price">${{servicePrice}}</span>
    </div>
    <div class="service-row">
      <span class="service-name">Shampoo</span>
      <span class="service-price">$40</span>
    </div>
  </div>

  <!-- Book button -->
  <button class="book-button" (click)="bookAppointment()">
    Book Appointment
  </button>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <button class="nav-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Calendar</span>
    </button>
    <button class="nav-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Chat</span>
    </button>
    <button class="nav-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Profile</span>
    </button>
  </nav>
</div>
