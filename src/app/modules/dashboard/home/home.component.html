<div class="home-container">
  <header class="home-header">
    <button class="menu-button">
      <i class="fas fa-bars"></i>
    </button>
    <div class="user-greeting">
      <h2>Hi</h2>
      <h3>{{userName}}</h3>
    </div>
    <div class="user-avatar">
      <img [src]="authService.currentUserValue?.photoUrl || 'assets/default-avatar.png'" alt="User avatar">
    </div>
  </header>

  <div class="promo-banner">
    <div class="promo-content">
      <h2>Look Awesome & Save Some</h2>
      <p>Get Up to 50% off</p>
    </div>
    <img src="assets/default-avatar.png" alt="Promotional image" class="promo-image">
  </div>

  <section class="categories-section">
    <h3>Categories</h3>
    <div class="categories-grid">
      <div *ngFor="let category of categories" class="category-card">
        <img [src]="category.imageUrl" [alt]="category.name">
        <span>{{category.name}}</span>
      </div>
    </div>
  </section>

  <section class="stylists-section">
    <h3>Hair Specialist</h3>
    <div class="stylists-list">
      <div *ngFor="let stylist of stylists" class="stylist-card">
        <img [src]="stylist.imageUrl" [alt]="stylist.name">
        <div class="stylist-info">
          <span class="stylist-name">{{stylist.name}}</span>
          <div class="stylist-rating">
            <span class="stars">★★★★★</span>
            <span class="rating-value">{{stylist.rating}}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<nav class="bottom-nav">
  <a routerLink="/dashboard" routerLinkActive="active">
    <i class="fas fa-home"></i>
  </a>
  <a routerLink="/appointments" routerLinkActive="active">
    <i class="fas fa-calendar"></i>
  </a>
  <a routerLink="/messages" routerLinkActive="active">
    <i class="fas fa-comment"></i>
  </a>
  <a routerLink="/profile" routerLinkActive="active">
    <i class="fas fa-user"></i>
  </a>
</nav>
