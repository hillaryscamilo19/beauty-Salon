<div class="specialists-container">
  <h2 class="specialists-title">Hair Specialist</h2>

  <div class="specialists-list">
    <div class="specialist-card" *ngFor="let specialist of specialists">
      <div class="specialist-image">
        <img src="specialist.imageUrl" [alt]="specialist.name">
      </div>
      <div class="specialist-info">
        <h3 class="specialist-name">{{specialist.name}}</h3>
        <div class="specialist-rating">
          <span class="star" *ngFor="let star of [1, 2, 3]" [class.filled]="star <= specialist.rating">

          </span>
        </div>
        <div class="specialist-contact">

          <span>{{specialist.phone}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
